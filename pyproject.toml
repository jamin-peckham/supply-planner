[project]
name = "supply-planner"
version = "0.5.0"
description = "Collaborative trip supply planner"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.143.0",
    "mcp>=2.3.0",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
